[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flare"
version = "0.1.0"
description = "MuJoCo dual-arm + neck teleop/record/train/inference pipeline (Meta Quest via XRoboToolkit), extracted from cashier_policy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "zarr<3",
    "datasets>=4.7.0",
    "huggingface-hub[hf-transfer,cli]>=1.7.1",
    "pandas>=2.3.3",
    "jsonlines>=4.0.0",
    "torchcfm==1.0.5",
    "timm==1.0.20",
    "einops==0.8.1",
    "diffusers==0.30.3",
    "numpy>=2.0",
    "scipy>=1.17.0",
    "rich>=14.3.3",
    "fvcore==0.1.5.post20221221",
    "gdown>=5.2.1",
    "lerobot==0.5.1",
]

[project.optional-dependencies]
train = [
    "wandb>=0.24.2",
    "moviepy==1.0.3",
    "imageio>=2.37.3",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
]
eval = [
    "imageio>=2.37.3",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
]
sim = [
    "mujoco>=3.6.0",
    "dm-control>=1.0.38",
]
teleop = [
    "placo>=0.6",
    "meshcat>=0.3",
]
all = [
    "flare[train,eval,sim,teleop]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flare*"]

[project.scripts]
flare-train = "flare.scripts.train:main"
